<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Minh Thành Công - Nhận Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .icon-success {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
        .key-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 16px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .btn-copy {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-copy:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-success">✓</div>
        <h1>Xác Minh Thành Công!</h1>
        <p>Đây là Key cá nhân của bạn. Mỗi thiết bị nhận 1 Key cố định riêng biệt.</p>
        
        <div class="key-box" id="keyDisplay">Đang tạo Key...</div>
        <button class="btn-copy" onclick="copyKey()">Sao Chép Key</button>
    </div>

    <script>
        // Thuật toán tạo Key khớp 100% với Roblox Script
        function getDeviceKey() {
            let userKey = localStorage.getItem("HOANGAURA_DEVICE_KEY");
            if (userKey) return userKey;

            // Tạo mã fingerprint cố định cho thiết bị
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_STRING) : '';
            const rawId = navigator.userAgent + screen.width + screen.height + renderer;

            let hash = 0;
            for (let i = 0; i < rawId.length; i++) {
                hash = (hash * 31 + rawId.charCodeAt(i)) % 4294967296;
            }
            
            const hexHash = Math.abs(hash).toString(16).padStart(8, '0').toUpperCase();
            userKey = `KEY-${hexHash.substring(0, 4)}-${hexHash.substring(4, 8)}`;
            
            localStorage.setItem("HOANGAURA_DEVICE_KEY", userKey);
            return userKey;
        }

        const myKey = getDeviceKey();
        document.getElementById("keyDisplay").innerText = myKey;

        function copyKey() {
            navigator.clipboard.writeText(myKey).then(() => {
                const btn = document.querySelector(".btn-copy");
                btn.innerText = "Đã Copy Thành Công!";
                btn.style.background = "#10b981";
                setTimeout(() => {
                    btn.innerText = "Sao Chép Key";
                    btn.style.background = "#3b82f6";
                }, 2000);
            });
        }
    </script>
</body>
</html>
