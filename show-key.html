<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lennon Hub - Get Key Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d16;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng đốm sáng Neon phía sau */
        .glow-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: pulse 6s infinite alternate;
        }
        .glow-bg-2 {
            position: absolute;
            bottom: 10%;
            right: 15%;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.7; }
        }

        /* Glassmorphism Card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .icon-box {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            font-size: 13px;
            font-weight: 700;
            border-radius: 30px;
            margin-bottom: 16px;
        }

        .key-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 18px;
            border-radius: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 24px;
            word-break: break-all;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .btn-copy {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #4f46e5, #4338ca);
        }

        .btn-copy:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="glow-bg-2"></div>

    <div class="card">
        <div class="icon-box">✓</div>
        <h1>Xác Minh Thành Công!</h1>
        <p>Sao chép Key bên dưới và dán vào Roblox để kích hoạt Script.</p>

        <div class="badge">✨ LENNON HUB VIP</div>
        <div class="key-box" id="keyDisplay">LENNON-WJXQH-KPLM</div>

        <button class="btn-copy" id="copyBtn" onclick="copyKey()">Sao Chép Key Ngay</button>
    </div>

    <script>
        const KEY_LENNON = "LENNON-WJXQH-KPLM";

        function copyKey() {
            navigator.clipboard.writeText(KEY_LENNON).then(() => {
                const btn = document.getElementById("copyBtn");
                btn.innerText = "⚡ Đã Sao Chép Key!";
                btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                setTimeout(() => {
                    btn.innerText = "Sao Chép Key Ngay";
                    btn.style.background = "linear-gradient(135deg, #6366f1, #4f46e5)";
                }, 2000);
            });
        }
    </script>
</body>
</html>
