<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Minh Thành Công - Nhận Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .icon-success {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
        .key-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 16px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .btn-copy {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-copy:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-success">✓</div>
        <h1>Xác Minh Thành Công!</h1>
        <p>Sao chép Key bên dưới và dán vào Roblox để kích hoạt Script.</p>
        
        <div class="key-box" id="keyDisplay">KEY-LENNONHUBV3</div>
        <button class="btn-copy" onclick="copyKey()">Sao Chép Key</button>
    </div>

    <script>
        const FIXED_KEY = "KEY-LENNONHUBV3";

        function copyKey() {
            navigator.clipboard.writeText(FIXED_KEY).then(() => {
                const btn = document.querySelector(".btn-copy");
                btn.innerText = "Đã Copy Thành Công!";
                btn.style.background = "#10b981";
                setTimeout(() => {
                    btn.innerText = "Sao Chép Key";
                    btn.style.background = "#3b82f6";
                }, 2000);
            });
        }
    </script>
</body>
</html>
