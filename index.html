<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoangaura - Anime Multi-Hub System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://i.pinimg.com/originals/18/17/80/181780138cd91fc1f021727ff0646c10.gif') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            position: relative;
        }
        /* Lớp phủ mờ ảo phong cách anime */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            background: rgba(20, 22, 37, 0.85);
            border: 1px solid rgba(236, 72, 153, 0.4);
            padding: 35px 25px;
            border-radius: 24px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(236, 72, 153, 0.2);
        }
        h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 117, 140, 0.3);
        }
        .subtitle {
            font-size: 12px;
            color: #a0aec0;
            margin-bottom: 25px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-2 { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; }
        .btn-3 { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; }
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.2);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #718096;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>✨ ANIME MULTI-HUB ✨</h2>
        <div class="subtitle">Chọn Hub để lấy Key tự động (Mỗi 12 tiếng)</div>
        
        <!-- Thay link4m tương ứng của bạn vào đây -->
        <a href="https://link4m.org/go/VAgwdqi" class="btn btn-1" target="_blank">🔑 Get Key VoidShell Hub</a>
        <a href="https://link4m.org/FSE8f0aN" class="btn btn-2" target="_blank">🛡️ Get Key WhiteX Hub</a>
        <a href="https://link4m.org/go/Nl1zeEbq" class="btn btn-3" target="_blank">🚀 Get Key VZStudio Hub</a>

        <div class="footer">POWERED BY HOANGAURA</div>
    </div>
</body>
</html>
