<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VZStudio - Key Result</title>
    <style>
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://i.pinimg.com/originals/52/6c/fa/526cfa735071190bc19e34e5a953e5ff.gif') no-repeat center center fixed;
            background-size: cover; color: #fff; position: relative;
        }
        body::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10,10,20,0.75); backdrop-filter: blur(8px); z-index: 1; }
        .box { position: relative; z-index: 2; background: rgba(20,22,37,0.9); padding: 30px; border-radius: 20px; text-align: center; width: 320px; border: 1px solid rgba(6, 182, 212, 0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        h3 { color: #06b6d4; margin-top: 0; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
        .key-box { background: #0f1117; padding: 12px; border-radius: 10px; font-weight: bold; color: #34d399; margin: 15px 0; word-break: break-all; border: 1px dashed #06b6d4; }
        .copy-btn { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .copy-btn:hover { filter: brightness(1.2); transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="box">
        <h3>🎉 VZStudio Key</h3>
        <div class="key-box" id="keyDisplay">Đang tạo...</div>
        <button class="copy-btn" onclick="copyKey()">📋 Copy Key Ngay</button>
    </div>
    <script>
        function getKey() {
            const d = new Date();
            return `VZ-${d.getFullYear()}${d.getMonth()+1}${d.getDate()}-${d.getHours() < 12 ? 'P1' : 'P2'}`;
        }
        const k = getKey();
        document.getElementById('keyDisplay').innerText = k;
        function copyKey() { navigator.clipboard.writeText(k); alert('Đã copy Key VZStudio thành công!'); }
    </script>
</body>
</html>
